services:
  quantum:
    build: .
    container_name: quantum-lab
    command: "jupyter notebook --ip=0.0.0.0 --port=8080 --allow-root"
    volumes:
      - .:/home
    working_dir: /home
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - JUPYTER_ENABLE_LAB=yes
    stdin_open: true     
    tty: true
